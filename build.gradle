plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		url = 'https://maven.fzzyhmstrs.me/'
		content { includeGroup 'me.fzzyhmstrs' }
	}
	maven {
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"buildupmobtweaks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'buildupmobtweaks-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = providers.gradleProperty('testEula').map { it.toBoolean() }.getOrElse(false)
    }
	configureDataGeneration {
		client = true
		modId = "buildupmobtweaks"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	// The publisher bundles tomlkt, Jankson and Permissions API in this mod.
	// Declare Loader/API/Kotlin explicitly; do not pull its optional Mod Menu POM dependency.
	implementation("me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}") { transitive = false }
	if (providers.gradleProperty('withModMenu').map { it.toBoolean() }.getOrElse(false)) {
		clientRuntimeOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// R2-A baseline: legacy S2 files stay in Git history/worktree but are not compiled or packaged.
sourceSets.main.java {
    include 'com/davidblackcn/buildupmobtweaks/BuildupMobTweaks.java'
    include 'com/davidblackcn/buildupmobtweaks/config/**'
    include 'com/davidblackcn/buildupmobtweaks/feature/**'
    include 'com/davidblackcn/buildupmobtweaks/equipment/**'
    include 'com/davidblackcn/buildupmobtweaks/traits/**'
    include 'com/davidblackcn/buildupmobtweaks/command/DiagnosticCommands.java'
    include 'com/davidblackcn/buildupmobtweaks/command/EquipmentCommands.java'
    include 'com/davidblackcn/buildupmobtweaks/rebuild/**'
    include 'com/davidblackcn/buildupmobtweaks/mixin/rebuild/**'
}
sourceSets.client.java {
    include 'com/davidblackcn/buildupmobtweaks/client/rebuild/**'
    include 'com/davidblackcn/buildupmobtweaks/client/mixin/rebuild/**'
    include 'com/davidblackcn/buildupmobtweaks/client/BuildupMobTweaksClient.java'
    include 'com/davidblackcn/buildupmobtweaks/client/BuildupMobTweaksDataGenerator.java'
}
sourceSets.gametest.java {
    include 'com/davidblackcn/buildupmobtweaks/SkeletonBehaviorTests.java'
    include 'com/davidblackcn/buildupmobtweaks/PillagerBehaviorTests.java'
    include 'com/davidblackcn/buildupmobtweaks/CombatTestWorld.java'
    include 'com/davidblackcn/buildupmobtweaks/CombatTestItems.java'
}

tasks.withType(Jar).configureEach {
	from('NOTICE.md')
	from('licenses') { into 'licenses' }

	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
